# ── 실제 사용 설정 ──────────────────────────────────────────────
# 1) .env.example → .env 복사 후 인증키 입력
# 2) python -m txc discover   → KOSIS 통계표ID 검색 결과(output/KOSIS_통계표_검색결과.xlsx)
# 3) 아래 kosis.tables 에 통계표ID 입력, files 에 내려받은 파일 경로·열 이름 입력
# 4) python -m txc run --start 2020 --end 2024 --csv
official_only: true                 # true: official: false 인 출처(NICE 등 민간자료)는 읽지 않음
years: {start: null, end: null}     # 비우면 작년 기준 최근 5년. 최소 3년 ~ 최대 5년
output_dir: output

validation:
  relative_tolerance: 0.05          # 출처 간 5% 이내 차이는 '일치'
  absolute_tolerance: 0.5           # 반올림 오차
  source_priority:                  # 채택값 우선순위(앞이 우선, 'KOSIS'는 KOSIS:* 전체)
    - DART
    - KOSIS
    - 관광산업조사(업체별)
    - NICE비즈라인                  # official_only: true 이면 쓰이지 않음

industry_aliases:                   # 출처마다 다른 업종명을 하나로
  관광호텔업: [관광호텔, 호텔업(관광호텔), 관광호텔업(1~5성)]
  가족호텔업: [가족호텔]
  호스텔업: [호스텔]
  소형호텔업: [소형호텔]
  휴양콘도미니엄업: [휴양콘도미니엄, 콘도미니엄업, 콘도]
  종합유원시설업: [테마파크업, 테마파크, 유원시설업(종합)]
  일반유원시설업: [유원시설업(일반)]
  기타유원시설업: [유원시설업(기타)]
  일반여행업: [종합여행업]
  국외여행업: [국외여행업]
  국내여행업: [국내외여행업, 국내여행업]
  관광식당업: [관광식당]
  카지노업: [카지노]

metric_aliases:
  매출액: [총매출, 총매출액, 매출, 매출액합계, 매출액(계)]
  종사자수: [종업원수, 종사자, 근로자수, 종사자(계)]
  사업체수: [업체수, 사업체, 사업체수(계)]
  객실수: [객실, 객실수(계)]
  입장객수: [입장객, 이용객수]

kosis:
  enabled: true
  api_key_env: KOSIS_API_KEY
  search_keywords: [관광산업조사, 관광사업체조사, 호텔업, 유원시설업, 테마파크]
  tables:
    # discover 결과에서 골라 입력하세요(예시는 형식만 보여 줌, tbl_id는 임의값)
    - name: 관광산업조사_업종별
      enabled: false                # tbl_id 입력 후 true
      org_id: "113"
      tbl_id: DT_113_XXXXXXXX
      obj_levels: 2                 # 분류 단계 수(통계표마다 다름)
      industry_dim: C1_NM           # 업종이 들어 있는 분류
      region_dim: null              # 시도 분류가 있으면 C2_NM 등
      metric_map: {}                # 비우면 항목명(ITM_NM)을 metric_aliases로 변환
                                    # 예) {매출액: 매출액, 종사자: 종사자수, 사업체: 사업체수}
    - name: 관광산업조사_시도별
      enabled: false
      org_id: "113"
      tbl_id: DT_113_YYYYYYYY
      obj_levels: 2
      industry_dim: C2_NM
      region_dim: C1_NM

nts:                                # 국세청 사업자등록 상태조회(휴·폐업)
  enabled: true
  api_key_env: NTS_API_KEY

dart:                               # 금융감독원 Open DART(무료). 기업개황·사업보고서 재무
  enabled: true
  api_key_env: DART_API_KEY
  fs_div: OFS                       # OFS 개별, CFS 연결
  max_firms: 500                    # 1회 실행 업체 수 상한(하루 호출 한도 20,000건)
  pause_sec: 0.1
  cache: output/cache/CORPCODE.xml

files:
  # ── NICE비즈라인: 기업검색 → 재무 엑셀 내려받기 (열 이름은 내려받은 파일에 맞게 수정)
  - name: NICE비즈라인
    official: false                 # 민간(유료) 자료 → official_only: true 이면 제외
    org: NICE평가정보
    level: firm
    path: data/nice_bizline.xlsx
    sheet: 0
    header_row: 1
    columns:
      사업자등록번호: biz_no
      기업명: firm_name
      산업분류명: industry
      주소: address
      결산년도: year
      매출액: 매출액
      영업이익: 영업이익
      종업원수: 종사자수
    units: {매출액: 천원, 영업이익: 천원}   # NICE 기본 단위 확인 후 수정

  # ── 관광산업조사 업체별 원자료(조사기관 보유분). 지표_연도 열이면 format: wide
  - name: 관광산업조사(업체별)
    org: 문화체육관광부·한국문화관광연구원
    level: firm
    path: data/tourism_survey_firms.xlsx
    format: long
    columns: {사업자번호: biz_no, 사업체명: firm_name, 업종: industry, 시도: region,
              조사연도: year, 매출액: 매출액, 종사자수: 종사자수}
    units: {매출액: 백만원}

  # ── 호텔업 운영현황(문체부·한국호텔업협회). 사업자번호 없으면 업체명으로 매칭
  - name: 호텔업 운영현황
    enabled: false                  # 작성기관·정확도 확인 전까지 제외(확인되면 true)
    official: false
    org: 문화체육관광부·한국호텔업협회
    level: firm
    path: data/hotel_survey.xlsx
    columns: {연도: year, 호텔명: firm_name, 지역: region, 객실수: 객실수, 매출액: 매출액}
    fixed: {industry: 관광호텔업}
    units: {매출액: 백만원}

  # ── 테마파크업(유원시설업) 현황 - 업종별 합계 자료
  - name: 테마파크업 현황
    enabled: false                  # 작성기관·정확도 확인 전까지 제외(확인되면 true)
    official: false
    org: 문화체육관광부·한국종합유원시설협회
    level: industry
    path: data/themepark_industry.xlsx
    columns: {기준년도: year, 구분: industry, 사업체수: 사업체수, 매출액: 매출액, 입장객수: 입장객수}
    units: {매출액: 억원}

  # ── 지방행정 인허가(LOCALDATA) 전체 CSV: 관광숙박업 / 유원시설업 / 관광사업자
  - name: 인허가(관광숙박업)
    org: 행정안전부 지방행정인허가
    level: status
    path: data/localdata_관광숙박업.csv
    columns: {사업장명: firm_name, 소재지전체주소: address, 업태구분명: industry,
              영업상태명: status, 폐업일자: status_date, 인허가일자: open_date}
    derive_counts: true
  - name: 인허가(유원시설업)
    org: 행정안전부 지방행정인허가
    level: status
    path: data/localdata_유원시설업.csv
    columns: {사업장명: firm_name, 소재지전체주소: address, 업태구분명: industry,
              영업상태명: status, 폐업일자: status_date, 인허가일자: open_date}
    derive_counts: true

  # ── KOSIS API 대신 KOSIS 화면에서 내려받은 파일을 쓸 때(선택)
  - name: KOSIS(내려받기)
    enabled: false
    org: 문화체육관광부
    level: industry
    path: data/kosis_download.xlsx
    columns: {시점: year, 업종별: industry, 항목: metric, 값: value, 단위: unit}
